  s+=C["cluster_"+cfg.cluster]||0;
  s+=C["budget_"+cfg.bracket]||0;
  const dom=cfg.origin===mkt||(mkt==="GB_IE"&&(cfg.origin==="GB"||cfg.origin==="IE"));
  if(dom){s+=C["is_domestic"]||0;s+=C["cluster_"+cfg.cluster+"_x_domestic"]||0;}
  cfg.genres.forEach(g=>{s+=C["genre_"+g]||0;});
  cfg.keywords.forEach(k=>{s+=C["kw_"+k]||0;s+=C["kw_"+k+"_x_market_"+mkt]||0;});
  s+=C["lang_"+cfg.lang+"_x_market_"+mkt]||0;
  s+=C["origin_"+cfg.origin+"_x_market_"+mkt]||0;
  s+=C["cluster_"+cfg.cluster+"_x_market_"+mkt]||0;
  return s;
}

function toTix(z,c){const st=MODEL.cs[c];if(!st)return 0;return Math.max(0,Math.round(Math.exp(z*st.std_log+st.mean_log)-1));}
function fmt(n){if(n>=1e6)return(n/1e6).toFixed(1)+"M";if(n>=1e3)return Math.round(n/1e3)+"K";return ""+n;}

function TagInput({items,selected,onToggle,placeholder,label}){
  const[search,setSearch]=useState("");
  const filtered=items.filter(i=>i.includes(search.toLowerCase())&&!selected.includes(i)).slice(0,8);
  return(
    <div style={{marginBottom:12}}>
      <span className="lbl">{label}</span>
      <div style={{display:"flex",flexWrap:"wrap",marginBottom:4}}>
        {selected.map(s=><span key={s} className="tag" onClick={()=>onToggle(s)}>{s} &times;</span>)}
      </div>
      <div style={{position:"relative"}}>
        <input className="inp" value={search} onChange={e=>setSearch(e.target.value)} placeholder={placeholder}/>
        {search&&filtered.length>0&&(
          <div className="dd-list">
            {filtered.map(i=><div key={i} className="dd-item" onClick={()=>{onToggle(i);setSearch("");}}>{i}</div>)}
          </div>
        )}
      </div>
    </div>
  );
}

function ConfigPanel({config,setConfig,label,color}){
  const tKw=useCallback(k=>{setConfig(c=>({...c,keywords:c.keywords.includes(k)?c.keywords.filter(x=>x!==k):[...c.keywords,k]}));},[]);
  const tG=useCallback(g=>{setConfig(c=>({...c,genres:c.genres.includes(g)?c.genres.filter(x=>x!==g):[...c.genres,g]}));},[]);
  return(
    <div className="panel" style={{borderColor:color+"33",borderWidth:1,borderStyle:"solid"}}>
      <h3 style={{fontSize:12,fontWeight:700,color,textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:12}}>{label}</h3>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:12}}>
        <div><span className="lbl">Language</span>
          <select className="sel" value={config.lang} onChange={e=>setConfig(c=>({...c,lang:e.target.value}))}>
            {MODEL.langs.map(l=><option key={l} value={l}>{LN[l]||l}</option>)}
          </select>
        </div>
        <div><span className="lbl">Origin Country</span>
          <select className="sel" value={config.origin} onChange={e=>setConfig(c=>({...c,origin:e.target.value}))}>
            {MODEL.origins.map(o=><option key={o} value={o}>{CN[o]||o}</option>)}
          </select>
        </div>
        <div><span className="lbl">Content Type</span>
          <select className="sel" value={config.cluster} onChange={e=>setConfig(c=>({...c,cluster:parseInt(e.target.value)}))}>
            {MODEL.clusters.map(cl=><option key={cl} value={cl}>{MODEL.cd[cl]}</option>)}
          </select>
        </div>
        <div><span className="lbl">Budget Bracket</span>
          <select className="sel" value={config.bracket} onChange={e=>setConfig(c=>({...c,bracket:e.target.value}))}>
            {MODEL.brackets.map(b=><option key={b} value={b}>{b}</option>)}
          </select>
        </div>
      </div>
      <TagInput items={MODEL.genres} selected={config.genres} onToggle={tG} placeholder="Search genres..." label="Genres"/>
      <TagInput items={MODEL.kw} selected={config.keywords} onToggle={tKw} placeholder="Search keywords..." label="Keywords"/>
    </div>
  );
}

function App(){
  const[cA,sA]=useState({lang:"en",origin:"GB",cluster:0,bracket:"mid (8-25M)",genres:["horror","thriller"],keywords:["murder","blood","monster"]});
  const[cB,sB]=useState({lang:"fr",origin:"FR",cluster:0,bracket:"european (3-8M)",genres:["horror","thriller"],keywords:["murder","blood","monster"]});
  const[sort,setSort]=useState("ticketsA");
  const[sortDir,setSortDir]=useState(-1);
  const[comp,setComp]=useState(true);

  const results=useMemo(()=>MODEL.countries.map(c=>{
    const zA=predict(cA,c),zB=predict(cB,c);
    return{code:c,name:CN[c]||c,zA,pctA:normCdf(zA),ticketsA:toTix(zA,c),zB,pctB:normCdf(zB),ticketsB:toTix(zB,c),delta:zB-zA,deltaPct:normCdf(zB)-normCdf(zA),deltaTickets:toTix(zB,c)-toTix(zA,c)};
  }),[cA,cB]);

  const sorted=useMemo(()=>[...results].sort((a,b)=>sortDir*(a[sort]>b[sort]?1:a[sort]<b[sort]?-1:0)),[results,sort,sortDir]);
  const totA=results.reduce((s,r)=>s+r.ticketsA,0);
  const totB=results.reduce((s,r)=>s+r.ticketsB,0);
  const avgA=(results.reduce((s,r)=>s+r.zA,0)/results.length).toFixed(3);
  const avgB=(results.reduce((s,r)=>s+r.zB,0)/results.length).toFixed(3);

  const doSort=col=>{if(sort===col)setSortDir(d=>d*-1);else{setSort(col);setSortDir(-1);}};
  const zCol=z=>z>0.15?"#4ade80":z>0?"#86efac":z>-0.15?"#fbbf24":"#f87171";
  const dCol=d=>d>0.02?"#4ade80":d>-0.02?"#888":"#f87171";
  const TH=({col,children})=><th className={sort===col?"active":""} onClick={()=>doSort(col)}>{children}{sort===col?(sortDir>0?" ▲":" ▼"):""}</th>;

  return(
    <div style={{padding:16,maxWidth:1200,margin:"0 auto"}}>
      <div style={{textAlign:"center",marginBottom:24}}>
        <h1 style={{fontSize:24,fontWeight:700,color:"#d4a853",letterSpacing:"-0.02em"}}>European Cinema Performance Predictor</h1>
        <p style={{fontSize:11,color:"#666",marginTop:4}}>Ridge regression · R² = 0.177 · 35 European markets · Compare two film configurations</p>
      </div>

      <div style={{textAlign:"center",marginBottom:16}}>
        <button className={"btn"+(comp?" active":"")} onClick={()=>setComp(c=>!c)}>
          {comp?"Comparison Mode ON":"Comparison Mode OFF"}
        </button>
      </div>

      <div style={{display:"grid",gridTemplateColumns:comp?"1fr 1fr":"1fr",gap:16,marginBottom:24,maxWidth:comp?"100%":520,margin:comp?"0 0 24px":"0 auto 24px"}}>
        <ConfigPanel config={cA} setConfig={sA} label="Configuration A — Base Film" color="#60a5fa"/>
        {comp&&<ConfigPanel config={cB} setConfig={sB} label="Configuration B — Perturbation" color="#f472b6"/>}
      </div>

      <div style={{display:"grid",gridTemplateColumns:comp?"1fr 1fr":"1fr",gap:16,marginBottom:16,maxWidth:comp?"100%":520,margin:comp?"0 0 16px":"0 auto 16px"}}>
        <div className="summary-card" style={{border:"1px solid #60a5fa33"}}>
          <div style={{fontSize:10,textTransform:"uppercase",letterSpacing:"0.08em",color:"#60a5fa"}}>Config A — Est. Total Tickets</div>
          <div style={{fontSize:22,fontWeight:700,color:"#60a5fa"}}>{fmt(totA)}</div>
          <div style={{fontSize:11,color:"#888"}}>Avg z-score: {avgA}</div>
        </div>
        {comp&&<div className="summary-card" style={{border:"1px solid #f472b633"}}>
          <div style={{fontSize:10,textTransform:"uppercase",letterSpacing:"0.08em",color:"#f472b6"}}>Config B — Est. Total Tickets</div>
          <div style={{fontSize:22,fontWeight:700,color:"#f472b6"}}>{fmt(totB)}</div>
          <div style={{fontSize:11,color:totB-totA>0?"#4ade80":"#f87171"}}>{totB-totA>0?"+":""}{fmt(totB-totA)} vs A · Avg z: {avgB}</div>
        </div>}
      </div>

      <div style={{background:"#0f0f23",borderRadius:8,border:"1px solid #222",overflow:"hidden"}}>
        <div style={{overflowX:"auto"}}>
          <table>
            <thead><tr style={{background:"#141428"}}>
              <TH col="name">Market</TH>
              <TH col="zA">Z-score A</TH>
              <TH col="pctA">Pctile A</TH>
              <TH col="ticketsA">Tickets A</TH>
              {comp&&<><TH col="zB">Z-score B</TH><TH col="pctB">Pctile B</TH><TH col="ticketsB">Tickets B</TH><TH col="delta">Δ Z-score</TH><TH col="deltaTickets">Δ Tickets</TH></>}
            </tr></thead>
            <tbody>
              {sorted.map(r=><tr key={r.code}>
                <td>{r.name}</td>
                <td style={{color:zCol(r.zA)}}>{(r.zA>=0?"+":"")+r.zA.toFixed(3)}</td>
                <td style={{color:"#aaa"}}>{r.pctA.toFixed(0)}%</td>
                <td style={{color:"#ddd"}}>{fmt(r.ticketsA)}</td>
                {comp&&<>
                  <td style={{color:zCol(r.zB)}}>{(r.zB>=0?"+":"")+r.zB.toFixed(3)}</td>
                  <td style={{color:"#aaa"}}>{r.pctB.toFixed(0)}%</td>
                  <td style={{color:"#ddd"}}>{fmt(r.ticketsB)}</td>
                  <td style={{color:dCol(r.delta)}}>{(r.delta>=0?"+":"")+r.delta.toFixed(3)}</td>
                  <td style={{color:dCol(r.deltaTickets)}}>{(r.deltaTickets>=0?"+":"")+fmt(r.deltaTickets)}</td>
                </>}
              </tr>)}
            </tbody>
          </table>
        </div>
      </div>

      <p style={{textAlign:"center",fontSize:10,color:"#444",marginTop:12}}>
        Ridge regression trained on 1064 European films across 35 markets. Ticket estimates are approximate. Model R² = 0.177.
      </p>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
